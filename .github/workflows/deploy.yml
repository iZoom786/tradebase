# Tradebase Platform - CD Pipeline
# Deploys to production on merge to main branch

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'latest'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: tradebase

jobs:
  # =====================================================
  # Job 1: Build and Push Docker Images
  # =====================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - ingestion
          # Add services as they're implemented
          # - features
          # - ml-engine
          # - paper-trading
          # - api-gateway
          # - dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  # =====================================================
  # Job 2: Create Git Tag
  # =====================================================
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          # Generate version based on date and commit count
          VERSION=$(date +'%Y.%m.%d')-$(git rev-list --count main)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Create and push tag
        run: |
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================
  # Job 3: Deploy to Staging
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, tag]
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == ''

    environment:
      name: staging
      url: https://staging.tradebase.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            cd /opt/tradebase-staging

            # Pull latest code
            git pull origin main

            # Login to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull and restart services
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d

            # Run database migrations if needed
            docker-compose -f docker-compose.staging.yml exec -T timescaledb \
              psql -U postgres -d tradebase -c "SELECT version();"

            # Health check
            sleep 10
            curl -f http://localhost:8000/health || exit 1

            echo "✓ Deployed to staging successfully"

      - name: Run smoke tests
        run: |
          curl -f ${{ secrets.STAGING_URL }}/health || exit 1
          curl -f ${{ secrets.STAGING_URL }}/metrics || exit 1

  # =====================================================
  # Job 4: Deploy to Production
  # =====================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, tag, deploy-staging]
    if: github.event.inputs.environment == 'production'

    environment:
      name: production
      url: https://tradebase.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backup before deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            cd /opt/tradebase

            # Create database backup
            docker-compose exec -T timescaledb \
              pg_dump -U postgres tradebase > backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql

            # Backup current containers
            docker-compose -f docker-compose.prod.yml config > backups/docker-config-backup.txt

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            cd /opt/tradebase

            # Pull latest code
            git pull origin main

            # Login to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Zero-downtime deployment
            # 1. Pull new images
            docker-compose -f docker-compose.prod.yml pull

            # 2. Start new containers alongside old
            docker-compose -f docker-compose.prod.yml up -d --no-deps --scale ingestion=2

            # 3. Wait for new containers to be healthy
            sleep 30

            # 4. Stop old containers
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

            # 5. Verify deployment
            docker-compose -f docker-compose.prod.yml ps

            echo "✓ Deployed to production successfully"

      - name: Health checks
        run: |
          # Check all services
          curl -f https://api.tradebase.com/health || exit 1
          curl -f https://tradebase.com || exit 1

          # Check NATS connectivity
          nc -zv ${{ secrets.PRODUCTION_HOST }} 4222 || exit 1

      - name: Monitor for 5 minutes
        run: |
          echo "Monitoring production for 5 minutes..."
          for i in {1..12}; do
            curl -f https://api.tradebase.com/health
            sleep 25
          done

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          # Implement rollback logic here
          exit 1

  # =====================================================
  # Job 5: Notification
  # =====================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }}
            Environment: ${{ github.event.inputs.environment || 'staging' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

      - name: Update deployment status
        run: |
          echo "Deployment Status: ${{ job.status }}"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
