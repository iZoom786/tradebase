# Pre-commit hooks for Tradebase Platform
# Install: pip install pre-commit && pre-commit install

repos:
  # =====================================================
  # General Hooks
  # =====================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
      - id: debug-statements

  # =====================================================
  # Python Hooks
  # =====================================================
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.0
          - types-requests

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-r, services/, libs/]
        exclude: ^tests/

  # =====================================================
  # Security Hooks
  # =====================================================
  - repo: https://github.com/Lucas-C/doom-docs-helm
    rev: v1.0.0
    hooks:
      - id: helm-docs
        args: [--chart-values-location,infrastructure/nats/]

  # =====================================================
  # Docker Hooks
  # =====================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v3.1.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

  # =====================================================
  # Shell Scripts
  # =====================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [-x]

  # =====================================================
  # CI Configuration
  # =====================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: local
    hooks:
      - id: validate-docker-compose
        name: Validate docker-compose syntax
        entry: docker-compose -f docker-compose.yml config
        language: system
        files: ^docker-compose.*\.yml$

      - id: check-python-version
        name: Check Python version consistency
        entry: bash -c '! grep -r "python:3\.[0-9]" . --include="*.Dockerfile" --include="*.yml" | grep -v "3.11"'
        language: system
        files: ^(Dockerfile|docker-compose.*\.yml)$

# Configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from commits

    This commit was automatically generated by pre-commit-ci
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_branch: ''
  skip: [mypy]
  submodules: false
