services:

  # ============================================================
  # NATS + JETSTREAM
  # ============================================================
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped

    command:
      - "--config"
      - "/etc/nats/nats_simple.conf"

    ports:
      - "4223:4222"

    expose:
      - "8222"

    volumes:
      - nats_data:/data
      - ./infrastructure/nats/nats_simple.conf:/etc/nats/nats_simple.conf:ro

    networks:
      - tradebase_network


  # ============================================================
  # NATS PROMETHEUS EXPORTER
  # ============================================================
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    restart: unless-stopped

    expose:
      - "7777"

    command:
      - "-connz"
      - "-subz"
      - "-varz"
      - "http://nats:8222"

    depends_on:
      - nats

    networks:
      - tradebase_network


  # ============================================================
  # NATS NUI
  # ============================================================
  natsnui:
    build:
      context: https://github.com/nats-nui/nui.git#v0.9.3
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "31311"

    volumes:
      - natsnui_data:/db

    depends_on:
      - nats

    networks:
      - tradebase_network
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      - "traefik.http.routers.tradebase-nui-http.rule=Host(`streaming.revoseek.com`)"
      - "traefik.http.routers.tradebase-nui-http.entrypoints=web"
      - "traefik.http.routers.tradebase-nui-http.middlewares=redirect-to-https@file"

      - "traefik.http.routers.tradebase-nui.rule=Host(`streaming.revoseek.com`)"
      - "traefik.http.routers.tradebase-nui.entrypoints=websecure"
      - "traefik.http.routers.tradebase-nui.tls=true"
      - "traefik.http.routers.tradebase-nui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tradebase-nui.service=tradebase-nui"

      - "traefik.http.services.tradebase-nui.loadbalancer.server.port=31311"


  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    networks:
      - tradebase_network

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    expose:
      - "9090"

    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    networks:
      - tradebase_network
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      - "traefik.http.routers.tradebase-prometheus-http.rule=Host(`prometheus.revoseek.com`)"
      - "traefik.http.routers.tradebase-prometheus-http.entrypoints=web"
      - "traefik.http.routers.tradebase-prometheus-http.middlewares=redirect-to-https@file"

      - "traefik.http.routers.tradebase-prometheus.rule=Host(`prometheus.revoseek.com`)"
      - "traefik.http.routers.tradebase-prometheus.entrypoints=websecure"
      - "traefik.http.routers.tradebase-prometheus.tls=true"
      - "traefik.http.routers.tradebase-prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tradebase-prometheus.service=tradebase-prometheus"

      - "traefik.http.services.tradebase-prometheus.loadbalancer.server.port=9090"


  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    depends_on:
      - prometheus

    networks:
      - tradebase_network
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      - "traefik.http.routers.tradebase-grafana-http.rule=Host(`grafana.revoseek.com`)"
      - "traefik.http.routers.tradebase-grafana-http.entrypoints=web"
      - "traefik.http.routers.tradebase-grafana-http.middlewares=redirect-to-https@file"

      - "traefik.http.routers.tradebase-grafana.rule=Host(`grafana.revoseek.com`)"
      - "traefik.http.routers.tradebase-grafana.entrypoints=websecure"
      - "traefik.http.routers.tradebase-grafana.tls=true"
      - "traefik.http.routers.tradebase-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tradebase-grafana.service=tradebase-grafana"

      - "traefik.http.services.tradebase-grafana.loadbalancer.server.port=3000"


  # ============================================================
  # SUBSCRIPTION SERVICE
  # ============================================================
  subscription:
    build:
      context: .
      dockerfile: services/subscription/Dockerfile

    restart: unless-stopped

    expose:
      - "8002"

    environment:
      NATS_URL: nats://nats:4222

      JWT_ISSUER_SEED: ${JWT_ISSUER_SEED:-change_me_in_production}
      JWT_DEFAULT_EXPIRY_HOURS: ${JWT_DEFAULT_EXPIRY_HOURS:-720}

      OBS_LOG_LEVEL: ${OBS_LOG_LEVEL:-INFO}

    depends_on:
      - nats

    networks:
      - tradebase_network


  # ============================================================
  # INGESTION SERVICE
  # ============================================================
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile

    restart: unless-stopped

    expose:
      - "8001"
      - "9091"

    environment:

      # --------------------------------------------------------
      # EXTERNAL POSTGRESQL / TIMESCALEDB
      # --------------------------------------------------------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-tradebase}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}

      # --------------------------------------------------------
      # NATS
      # --------------------------------------------------------
      NATS_URL: nats://nats:4222
      NATS_MAX_RECONNECT: "10"
      NATS_PING_INTERVAL: "60"
      NATS_CONNECT_TIMEOUT: "5"
      NATS_TLS_ENABLED: "false"

      NATS_SYSTEM_USER: ${NATS_SYSTEM_USER:-system_internal}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:-system_internal_password}

      # --------------------------------------------------------
      # OBSERVABILITY
      # --------------------------------------------------------
      OBS_PROMETHEUS_PORT: "9091"
      OBS_LOG_LEVEL: INFO

      # --------------------------------------------------------
      # MARKET INGESTION
      # --------------------------------------------------------
      INGESTION_PROVIDER: yfinance
      INGESTION_INTERVAL: 1m

      INGESTION_SYMBOLS: >-
        EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,NZDUSD

      INGESTION_BACKFILL_DAYS: "365"

      INGESTION_SCHEDULER_ENABLED: "true"
      INGESTION_SCHEDULER_INTERVAL_SECONDS: "60"

    depends_on:
      - nats

    volumes:
      - ./logs/ingestion:/app/logs
      - ./config:/app/config:ro

    networks:
      - tradebase_network


# ==============================================================
# NETWORKS
# ==============================================================
networks:

  tradebase_network:
    driver: bridge

  dokploy-network:
    external: true


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  nats_data:
  natsnui_data:
  redis_data:
  prometheus_data:
  grafana_data:
