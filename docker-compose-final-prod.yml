# Tradebase Platform - Single-file production deployment for Dockploy
# Use this file directly as the Docker Compose definition in Dockploy.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tradebase_timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradebase}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TIMESCALEDB_TELEMETRY: basic
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init_v2.sql:/docker-entrypoint-initdb.d/init.sql
      - /opt/imports:/tmp
    networks:
      - tradebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: tradebase_nats
    command: "--jetstream --config /etc/nats/nats_simple.conf"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "8081:8080"
    volumes:
      - nats_data:/data
      - ./infrastructure/nats/nats_simple.conf:/etc/nats/nats_simple.conf:ro
    environment:
      NATS_SYSTEM_USER: ${NATS_SYSTEM_USER:-system_internal}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:-system_internal_password}
    networks:
      - tradebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: tradebase_nats_exporter
    ports:
      - "7777:7777"
    command: ["-connz", "-subz", "-varz", "http://nats:8222"]
    depends_on:
      - nats
    networks:
      - tradebase_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradebase_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tradebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: tradebase_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - tradebase_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tradebase_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - tradebase_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tradebase_jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - tradebase_network
    restart: unless-stopped

  natsnui:
    image: ghcr.io/nats-nui/nui:0.9.3
    container_name: tradebase_natsnui
    ports:
      - "3222:31311"
    depends_on:
      - nats
    networks:
      - tradebase_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradebase_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@tradebase-app.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - timescaledb
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tradebase_network
    restart: unless-stopped

  subscription:
    build:
      context: .
      dockerfile: services/subscription/Dockerfile
    container_name: tradebase_subscription
    ports:
      - "8002:8002"
    environment:
      NATS_URL: nats://nats:4222
      JWT_ISSUER_SEED: ${JWT_ISSUER_SEED:-change_me_in_production}
      JWT_DEFAULT_EXPIRY_HOURS: ${JWT_DEFAULT_EXPIRY_HOURS:-720}
      OBS_LOG_LEVEL: ${OBS_LOG_LEVEL:-INFO}
    depends_on:
      - nats
    networks:
      - tradebase_network
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: tradebase_ingestion
    ports:
      - "8001:8001"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-tradebase}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_POOL_SIZE: 20
      NATS_URL: nats://nats:4222
      NATS_MAX_RECONNECT: 10
      NATS_PING_INTERVAL: 60
      NATS_CONNECT_TIMEOUT: 5
      NATS_TLS_ENABLED: "false"
      NATS_SYSTEM_USER: ${NATS_SYSTEM_USER:-system_internal}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:-system_internal_password}
      OBS_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OBS_PROMETHEUS_PORT: 9091
      OBS_LOG_LEVEL: INFO
      INGESTION_PROVIDER: yfinance
      INGESTION_INTERVAL: 1m
      INGESTION_SYMBOLS: EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,NZDUSD
      INGESTION_BACKFILL_DAYS: 365
      INGESTION_SCHEDULER_ENABLED: "true"
      INGESTION_SCHEDULER_INTERVAL_SECONDS: 60
    depends_on:
      - timescaledb
      - nats
    volumes:
      - ./logs/ingestion:/app/logs
      - ./config:/app/config:ro
    networks:
      - tradebase_network
    restart: unless-stopped

networks:
  tradebase_network:
    driver: bridge

volumes:
  timescaledb_data:
  nats_data:
  redis_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
