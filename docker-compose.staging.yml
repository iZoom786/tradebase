# Tradebase Platform - Staging Environment
# Overrides for staging deployment

version: '3.8'

services:
  # TimescaleDB - Staging Database
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tradebase_timescaledb_staging
    environment:
      POSTGRES_DB: tradebase_staging
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: basic
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_staging_data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # NATS - Staging Messaging
  nats:
    image: nats:latest
    container_name: tradebase_nats_staging
    command: "--jetstream --config /etc/nats/nats.conf"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_staging_data:/data
      - ./infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Staging Cache
  redis:
    image: redis:7-alpine
    container_name: tradebase_redis_staging
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Staging Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: tradebase_prometheus_staging
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'

  # Grafana - Staging Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tradebase_grafana_staging
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://staging.tradebase.com/grafana
    volumes:
      - grafana_staging_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

  # Jaeger - Staging Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tradebase_jaeger_staging
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"

  # =====================================================
  # Application Services (Staging)
  # =====================================================

  # Ingestion Service - Staging
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
      args:
        VERSION: ${VERSION:-staging}
        BUILD_DATE: ${BUILD_DATE}
    image: tradebase/ingestion:staging
    container_name: tradebase_ingestion_staging
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_DATABASE: tradebase_staging
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 10

      # NATS
      NATS_URL: nats://nats:4222
      NATS_MAX_RECONNECT: 10

      # Observability
      OBS_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OBS_PROMETHEUS_PORT: 9091
      OBS_LOG_LEVEL: INFO

      # Ingestion
      INGESTION_PROVIDER: yfinance
      INGESTION_SYMBOLS: EURUSD,GBPUSD,USDJPY
      INGESTION_INTERVAL: 1m
      INGESTION_BACKFILL_DAYS: 30
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  timescaledb_staging_data:
  nats_staging_data:
  redis_staging_data:
  prometheus_staging_data:
  grafana_staging_data:
