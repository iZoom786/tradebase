# Prometheus configuration for Tradebase Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tradebase'
    environment: 'development'

# Alertmanager configuration (placeholder)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# Rule files
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NATS monitoring (via Prometheus exporter)
  - job_name: 'nats'
    static_configs:
      - targets: ['nats-exporter:7777']
    metrics_path: '/metrics'
    scrape_interval: 10s

