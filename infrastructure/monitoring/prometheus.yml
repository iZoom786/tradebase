global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "nats"
    static_configs:
      - targets:
          - "nats-exporter:7777"

  - job_name: "ingestion"
    static_configs:
      - targets:
          - "ingestion:9091"
