# NATS Server Configuration - Tradebase Platform

# Server listening on all interfaces
host: "0.0.0.0"
port: 4222

# Monitoring port
monitor_port: 8222

# Server name
server_name: "tradebase_nats"

# JetStream enabled for persistence
jetstream {
    # Storage directory
    store_dir: /data/jetstream

    # Memory and file limits
    max_memory_store: 1073741824  # 1GB in bytes
    max_file_store: 10737418240   # 10GB in bytes
}

# Logging
log_file: /var/log/nats.log
logtime: true

# Authorization placeholder (will use JWT/NKey in production)
# authorization {
#     users = [
#         {user: admin, password: admin}
#     ]
# }

# TLS configuration (disabled for development, enable for production)
# tls {
#     cert_file: /etc/nats/certs/server.crt
#     key_file: /etc/nats/certs/server.key
#     ca_file: /etc/nats/certs/ca.crt
#     verify: true
#     verify_and_map: true
# }

# Maximum connections
max_connections: 10000

# Maximum payload size
max_payload: 1048576

# Ping intervals
ping_interval: "60s"
ping_max: 2

# Write deadline
write_deadline: "10s"

# Maximum pending messages
max_pending: 10000

# Maximum subscriptions per client
max_subs: 10000

# Maximum control line size
max_control_line: 512
