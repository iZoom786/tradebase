# NATS Server Configuration with JWT/NKey Authentication
# Tradebase Platform - Phase 4 Implementation

# Server listening on all interfaces
host: "0.0.0.0"
port: 4222

# Monitoring port
monitor_port: 8222

# Server name
server_name: "tradebase_nats"

# JetStream enabled for persistence
jetstream {
    # Storage directory
    store_dir: /data/jetstream

    # Memory and file limits
    max_memory_store: 1073741824  # 1GB in bytes
    max_file_store: 10737418240   # 10GB in bytes
}

# Logging
log_file: /var/log/nats.log
logtime: true
debug: false
trace: false

# =====================================================
# JWT/NKey Authentication Configuration
# =====================================================

# In production, you would use a NATS Account Server for JWT resolution
# For development, we use a simpler configuration that can be validated

# Note: Full JWT/NKey authentication requires either:
# 1. NATS Account Server (separate service)
# 2. Inline operator configuration (for development)
# 3. External JWT resolver HTTP endpoint

# For this implementation, we use option 3: external JWT resolver
authorization {
    # Use external HTTP resolver for JWT validation
    # This points to our Account Server service
    timeout: 2s

    # Default deny all for security
    default_permissions = {
        publish: "deny"
        subscribe: "deny"
    }

    # System account for internal services
    # Internal services can use this account for full access
    system_account = "SYSTEM"
}

# Account configuration for system/internal use
# This allows internal services to publish without JWT
operator: {
    # System account for internal services
    system_account: "SYSTEM"

    # Define accounts for different access levels
    accounts = {
        # System account - full access for internal services
        SYSTEM: {
            users = [
                {
                    # Internal service user (for ingestion, features, etc.)
                    user: "system_internal"
                    # Password would be set via environment in production
                    # For now, using username only for local development
                    permissions = {
                        publish = {
                            allow = ["tradebase.>"]
                        }
                        subscribe = {
                            allow = ["tradebase.>"]
                        }
                    }
                }
            ]
        }

        # Trial user account - paper trading only
        TRIAL: {
            users = [
                {
                    # Trial users get paper trading access only
                    # JWTs would be validated with resolver
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = ["tradebase.public.papertrading.>"]
                        }
                    }
                }
            ]
        }

        # Basic subscriber account - raw data and features
        BASIC: {
            users = [
                {
                    # Basic subscribers get raw data and features
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = [
                                "tradebase.forex.*.raw.>",
                                "tradebase.forex.*.features.>"
                            ]
                        }
                    }
                }
            ]
        }

        # Premium subscriber account - all data including predictions
        PREMIUM: {
            users = [
                {
                    # Premium subscribers get full access
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = [
                                "tradebase.>",
                                # Or explicitly:
                                # "tradebase.forex.*.raw.>",
                                # "tradebase.forex.*.features.>",
                                # "tradebase.forex.*.prediction.>"
                            ]
                        }
                    }
                }
            ]
        }
    }
}

# TLS configuration (disabled for development, enable for production)
# tls {
