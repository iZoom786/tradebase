# NATS Server Configuration with JWT/NKey Authentication
# Tradebase Platform - Phase 4 Implementation
#
# This configuration enables JWT/NKey authentication using an
# HTTP JWT resolver that points to the subscription service

# Server listening on all interfaces
host: "0.0.0.0"
port: 4222

# Monitoring port
monitor_port: 8222

# Server name
server_name: "tradebase_nats"

# JetStream enabled for persistence
jetstream {
    # Storage directory
    store_dir: /data/jetstream

    # Memory and file limits
    max_memory_store: 1073741824  # 1GB in bytes
    max_file_store: 10737418240   # 10GB in bytes
}

# Logging
log_file: /var/log/nats.log
logtime: true
debug: false
trace: false

# =====================================================
# JWT/NKey Authentication Configuration
# =====================================================

# HTTP JWT Resolver Configuration
# This allows NATS to validate JWTs via an HTTP endpoint
authorization {
    # Use HTTP resolver for JWT validation
    # The resolver runs in our subscription service
    timeout: 2s

    # Default deny all for security
    default_permissions = {
        publish: "deny"
        subscribe: "deny"
    }
}

# System account for internal services
# Internal services use this account for full access
# The system user credentials are passed via environment
system_account: "SYSTEM"

# Operator configuration for account-based auth
operator: {
    # System account for internal services
    system_account: "SYSTEM"

    # Define accounts for different access levels
    accounts = {
        # System account - full access for internal services
        SYSTEM: {
            # Import operator from file if using JWT operator
            # For now, we use simple username/password for internal services
            users = [
                {
                    # Internal service user (for ingestion, features, etc.)
                    user: $NATS_SYSTEM_USER
                    password: $NATS_SYSTEM_PASSWORD
                    permissions = {
                        publish = {
                            allow = ["tradebase.>"]
                        }
                        subscribe = {
                            allow = ["tradebase.>"]
                        }
                    }
                }
            ]
        }

        # Trial user account - paper trading only
        TRIAL: {
            users = [
                {
                    # Trial users get paper trading access only
                    # JWTs validated with resolver
                    user: $NATS_TRIAL_USER
                    password: $NATS_TRIAL_PASSWORD
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = ["tradebase.public.papertrading.>"]
                        }
                    }
                }
            ]
        }

        # Basic subscriber account - raw data and features
        BASIC: {
            users = [
                {
                    # Basic subscribers get raw data and features
                    user: $NATS_BASIC_USER
                    password: $NATS_BASIC_PASSWORD
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = [
                                "tradebase.forex.*.raw.>",
                                "tradebase.forex.*.features.>"
                            ]
                        }
                    }
                }
            ]
        }

        # Premium subscriber account - all data including predictions
        PREMIUM: {
            users = [
                {
                    # Premium subscribers get full access
                    user: $NATS_PREMIUM_USER
                    password: $NATS_PREMIUM_PASSWORD
                    permissions = {
                        publish = {
                            deny = [">"]
                        }
                        subscribe = {
                            allow = [
                                "tradebase.>",
                                # Or explicitly:
                                # "tradebase.forex.*.raw.>",
                                # "tradebase.forex.*.features.>",
                                # "tradebase.forex.*.prediction.>"
                            ]
                        }
                    }
                }
            ]
        }
    }
}

# =====================================================
# TLS Configuration
# =====================================================
# TLS is enabled for secure connections
# Certificates are mounted via docker volume
# NOTE: TLS temporarily disabled for testing - generate certs with:
#   cd scripts && bash generate-nats-certs.sh

# tls {
#     # Server certificate
#     cert_file: /etc/nats/certs/server.crt
#
#     # Server private key
#     key_file: /etc/nats/certs/server.key
#
#     # CA certificate (for client verification)
#     ca_file: /etc/nats/certs/ca.crt
#
#     # Verify client certificates (optional, set to false for now)
#     verify: false
#
#     # Verify and map client certificates to user accounts
#     verify_and_map: false
#
#     # Cipher suites (use secure defaults)
#     cipher_suites: [
#         "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
#         "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
#         "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
#         "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
#     ]
#
#     # Minimum TLS version
#     min_version: "1.2"
# }

# Maximum connections
max_connections: 10000

# Maximum payload size
max_payload: 1048576

# Ping intervals
ping_interval: "60s"
ping_max: 2

# Write deadline
write_deadline: "10s"

# Maximum pending messages
max_pending: 10000

# Maximum subscriptions per client
max_subs: 10000

# Maximum control line size
max_control_line: 512

# =====================================================
# WebSocket Configuration (for web clients)
# =====================================================
websocket {
    # WebSocket port
    port: 8080

    # Same TLS configuration as main port
    # tls: true  # TLS temporarily disabled for testing

    # Allowed origins (configure for production)
    allowed_origins: ["*"]
}

