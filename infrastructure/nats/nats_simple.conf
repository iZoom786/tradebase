# NATS Server Configuration - Simple Testing Mode
# Tradebase Platform - Phase 1 Testing
#
# This is a simplified configuration for testing without JWT/NKey/TLS

# Server listening on all interfaces
host: "0.0.0.0"
port: 4222

# Monitoring port
monitor_port: 8222

# Server name
server_name: "tradebase_nats"

# JetStream enabled for persistence
jetstream {
    # Storage directory
    store_dir: /data/jetstream

    # Memory and file limits
    max_memory_store: 1073741824  # 1GB in bytes
    max_file_store: 10737418240   # 10GB in bytes
}

# Logging
# log_file: /var/log/nats.log  # Disabled for container testing
logtime: true
debug: false
trace: false

# =====================================================
# Simple Username/Password Authentication
# =====================================================
# Authorization using simple username/password
# For production, migrate to JWT/NKey auth

authorization {
    timeout: 2s

    # Default deny all for security
    default_permissions = {
        publish: "deny"
        subscribe: "deny"
    }

    # System user - full access for internal services
    user: $NATS_SYSTEM_USER
    password: $NATS_SYSTEM_PASSWORD
    permissions = {
        publish = {
            allow = ["tradebase.>"]
        }
        subscribe = {
            allow = ["tradebase.>"]
        }
    }
}

# Maximum connections
max_connections: 10000

# Maximum payload size
max_payload: 1048576

# Maximum pending messages (must be >= max_pending)
max_pending: 1000000

# Ping intervals
ping_interval: "60s"
ping_max: 2

# Write deadline
write_deadline: "10s"

# Maximum pending messages (must be >= max_payload in bytes)
max_pending: 10485760

# Maximum subscriptions per client
max_subs: 10000

# Maximum control line size
max_control_line: 512
