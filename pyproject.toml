[project]
name = "tradebase"
version = "1.0.0"
description = "Tradebase AI Platform - Event-driven trading platform"
authors = [
    {name = "Tradebase Team"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "PROPRIETARY"}

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",

    # Database
    "asyncpg>=0.29.0",

    # NATS
    "nats-py>=2.7.0",
    "nkeys>=0.2.0",

    # Data Providers
    "yfinance>=0.2.28",

    # ML
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",

    # Observability
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "opentelemetry-exporter-prometheus>=0.43b0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",

    # Utils
    "httpx>=0.26.0",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=services --cov=libs --cov-report=html"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__init__.py",
]
